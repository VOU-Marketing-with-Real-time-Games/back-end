services:
  mysql-primary:
    image: mysql:8.0
    container_name: mysql-primary
    environment:
      MYSQL_ROOT_PASSWORD: pass
      MYSQL_DATABASE: vou
      BINLOG_FORMAT: ROW
      GTID_MODE: ON
      ENFORCE_GTID_CONSISTENCY: ON
    ports:
      - "3306:3306"
    volumes:
      - primary-data:/var/lib/mysql
      - ./primary-init:/docker-entrypoint-initdb.d
    command: >
      --default-authentication-plugin=mysql_native_password
      --server-id=1
      --log-bin=mysql-bin
      --binlog-do-db=vou
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-slave-updates=1

  mysql-replica-1:
    image: mysql:8.0
    container_name: mysql-replica-1
    environment:
      MYSQL_ROOT_PASSWORD: pass
    ports:
      - "3307:3306"
    volumes:
      - replica-1-data:/var/lib/mysql
      - ./replica-init:/docker-entrypoint-initdb.d
    depends_on:
      - mysql-primary
    command: >
      --default-authentication-plugin=mysql_native_password
      --server-id=2
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --read-only=1
      --relay-log=relay-bin
      --log-slave-updates=1

  mysql-replica-2:
    image: mysql:8.0
    container_name: mysql-replica-2
    environment:
      MYSQL_ROOT_PASSWORD: pass
    ports:
      - "3308:3306"
    volumes:
      - replica-2-data:/var/lib/mysql
      - ./replica-init:/docker-entrypoint-initdb.d
    depends_on:
      - mysql-primary
    command: >
      --default-authentication-plugin=mysql_native_password
      --server-id=3
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --read-only=1
      --relay-log=relay-bin
      --log-slave-updates=1

  proxysql:
    image: proxysql/proxysql:2.6.6
    container_name: proxysql
    ports:
      - "6032:6032" # ProxySQL admin interface
      - "6033:6033" # ProxySQL MySQL interface
    volumes:
      - ./proxysql.cnf:/etc/proxysql.cnf
    depends_on:
      - mysql-primary
      - mysql-replica-1
      - mysql-replica-2

  mongodb:
    image: mongo:7.0
    container_name: mongo-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass
      MONGO_INITDB_DATABASE: vou
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  primary-data:
  replica-1-data:
  replica-2-data:
  mongo-data:
