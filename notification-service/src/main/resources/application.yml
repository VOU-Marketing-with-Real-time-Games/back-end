spring:
  application:
     name: notification-service
  data:
    mongodb:
      uri: mongodb://root:123456@mongo1:27017,mongo2:27018,mongo3:27019/notification_db?replicaSet=rs0&authSource=admin
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
server:
  port: 8002

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
