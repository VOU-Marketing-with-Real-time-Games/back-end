spring:
  application:
    name: user_service
  datasource:
    url: jdbc:mysql://${MYSQL_URL}:3306/${USER_DB}
    username: ${USER_DB}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.hibernate.format_sql: true

server:
  port: 8005

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
