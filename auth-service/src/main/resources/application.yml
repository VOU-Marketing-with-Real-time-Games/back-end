spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${MONGODB_URI}
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ACCOUNT}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 9004
jwt:
  secret: ${JWT_SECRET:your-secret-key}
  expiration: 86400000
eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
outbound:
    identity:
        client-id: ${CLIENT_ID}
        client-secret: ${CLIENT_SECRET}
redirect-uri: ${REDIRECT_URI:https://your-redirect-uri.com/callback}