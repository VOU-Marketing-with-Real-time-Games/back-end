spring:
  application:
    name: campaign-service
  datasource:
    url: jdbc:mysql://${MYSQL_URL}:6033/${CAMPAIGN_DB}
    username: ${CAMPAIGN_DB}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
    template:
      mandatory: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_ACCOUNT}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
rabbitmq:
  exchange: campaign-exchange
  routingkey: campaign-routing
  queue: campaign-queue

server:
  port: 8004

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
