spring:
  application:
    name: brand-service
  datasource:
    url: jdbc:mysql://${MYSQL_URL}:6033/${BRAND_DB}
    username: ${BRAND_DB}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.format_sql: true
      hibernate.dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8003

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
