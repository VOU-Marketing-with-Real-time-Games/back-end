openapi: 3.0.3
info:
  title: VOU System API
  description: API Documentation for the VOU System complying with RESTful principles.
  version: 1.0.0
servers:
  - url: http://localhost:8080/v1
tags:
  - name: User
    description: Endpoints for managing users and their activities
  - name: Brand
    description: Endpoints for managing brands and branches
  - name: Campaign
    description: Endpoints for managing campaigns
  - name: Voucher
    description: Endpoints for managing vouchers
  - name: Notification
    description: Endpoints for managing notifications
  - name: GameInfo
    description: Endpoints for managing games, quizzes, and puzzles

paths:
  /users:
    post:
      tags:
        - User
      summary: Create a new user (register)
      description: Add a new user to the system.
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullname:
                  type: string
                  example: Le Minh Hoang
                username:
                  type: string
                  example: johndoe
                email:
                  type: string
                  format: email
                  example: johndoe@example.com
                password:
                  type: string
                  format: password
                  example: securePassword123
                role:
                  type: string
                  example: ADMIN
                phoneNum:
                  type: string
                  example: 0123456789 
                dob:
                  type: string
                  format: date
                  example: 2003-03-01
                gender :
                  type: string
                  example: MALE
                
              required:
                - username
                - email
                - password
                - fullname
                - phoneNum
      responses:
        201:
          description: User created successfully
        400:
          description: Validation error or Email, Username is existed

    get:
      tags:
        - User
      summary: Retrieve all users
      description: Get a list of all registered users.
      responses:
        200:
          description: List of users retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: UUID format
                    fullname:
                     type: string
                     example: Le Minh Hoang
                    avatar:
                     type: string
                     example: example avatar link
                    status:
                     type: string
                     example: ENABLE
                    username:
                     type: string
                     example: johndoe
                    email:
                     type: string
                     format: email
                     example: johndoe@example.com
                    role:
                     type: string
                     example: ADMIN
                    createdAt:
                     type: string
                     example: datetime data                     
                    phoneNum:
                     type: string
                     example: 0123456789 
      
  /users/{userId}:
    get:
      tags:
        - User
      summary: Retrieve a specific user
      description: Get details of a user by their unique ID.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            example: UUID format
      responses:
        200:
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                    id:
                      type: string
                      example: UUID format
                    fullname:
                     type: string
                     example: Le Minh Hoang
                    avatar:
                     type: string
                     example: example avatar link
                    status:
                     type: string
                     example: ENABLE
                    username:
                     type: string
                     example: johndoe
                    email:
                     type: string
                     format: email
                     example: johndoe@example.com
                    role:
                     type: string
                     example: ADMIN
                    createdAt:
                     type: string
                     example: datetime data                     
                    phoneNum:
                     type: string
                     example: 0123456789 
        404:
          description: User not found


    put:
      tags:
        - User
      summary: Update user details
      description: Modify the details of an existing user.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            example: UUID format
      requestBody:
        description: Updated user details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                    fullname:
                     type: string
                     example: Le Minh Hoang
                    avatar:
                     type: object
                     example: 
                    username:
                     type: string
                     example: johndoe
                    email:
                     type: string
                     format: email
                     example: johndoe@example.com
                    role:
                     type: string
                     example: ADMIN
                    phoneNum:
                     type: string
                     example: 0123456789 
      responses:
        200:
          description: User updated successfully
        404:
          description: User not found
        400:
          description: Validation error or Email, Username is existed

  /brands:
    post:
      tags:
        - Brand
      summary: Create a new brand
      description: Add a new brand to the system.
      requestBody:
        description: Brand details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: BrandName
                field:
                  type: string
                  example: Retail
              required:
                - name
                - field
    
      responses:
        201:
          description: Brand created successfully
        400:
          description: Validation error

    get:
      tags:
        - Brand
      summary: Retrieve all brands
      description: Get a list of all brands.
      responses:
        200:
          description: List of brands retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                   id:
                    type: number
                    example: 1
                   name:
                    type: string
                    example: ABC BrandName
                   field:
                    type: string
                    example: Retail
                   status:
                    type: string
                    example: ENABLE
                   enabled:
                    type: boolean
                    example: true
                   creator:
                    type: string
                    example: userId
                   createdAt:
                     type: string
                     format: date
                     example: 2024-03-01

  /brands/{brandId}:
    get:
      tags:
        - Brand
      summary: Retrieve a specific brand
      description: Get details of a brand by its unique ID.
      parameters:
        - name: brandId
          in: path
          required: true
          schema:
            type: number
            example: 1
      responses:
        200:
          description: Brand details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                    example: 1
                  name:
                    type: string
                    example: ABC BrandName
                  field:
                    type: string
                    example: Retail
                  status:
                    type: string
                    example: Retail
                  enabled:
                    type: boolean
                    example: true
                  creator:
                    type: string
                    example: userId
                  createdAt:
                    type: string
                    format: date
                    example: 2024-03-01
                
        404:
          description: Brand not found

    put:
      tags:
        - Brand
      summary: Update brand details
      description: Modify the details of an existing brand.
      parameters:
        - name: brandId
          in: path
          required: true
          schema:
            type: number
            example: 1
      requestBody:
        description: Updated brand details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: UpdatedBrandName
                field:
                  type: string
                  example: UpdatedField
                status:
                  type: string
                  example: REFUSE your brand is illegal
              required:
                - name
                - field
                - status
      responses:
        200:
          description: Brand updated successfully
        404:
          description: Brand not found

    delete:
      tags:
        - Brand
      summary: Delete a brand
      description: Remove a brand from the system by its unique ID.
      parameters:
        - name: brandId
          in: path
          required: true
          schema:
            type: number
            example: 1
      responses:
        204:
          description: Brand deleted successfully
        404:
          description: Brand not found

  /branches:
    post:
      tags:
        - Brand
      summary: Create a new branch
      description: Add a new branch under a brand.
      requestBody:
        description: Branch details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                brandId:
                  type: number
                  example: 1
                name:
                  type: string
                  example: BranchName
                address:
                  type: string
                  example: 123 Main St, City
                long:
                  type : number
                  example: 1.2
                lat:
                  type : number
                  example: 1.2
              required:
                - brandId
                - name
                - address
                - long
                - lat
      responses:
        201:
          description: Branch created successfully
        400:
          description: Validation error
        404:
          description: Brand not found

    get:
      tags:
        - Brand
      summary: Retrieve all branches
      description: Get a list of all branches.
      responses:
        200:
          description: List of branches retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                      example: 1
                    brandId:
                      type: number
                      example: 1  
                    name:
                      type: string
                      example: Branch ABC 
                    address:
                      type: string
                      example: 123 Main St, City
                    status:
                      type: string
                      example: OPENING
                    long:
                      type: number
                      example: 1.2
                    lat:
                      type: number
                      example: 1.2
